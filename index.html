<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7efdd">
  <title>Miki &amp; Saki — Merry Christmas 2026</title>
  <link rel="stylesheet" href="./style.css?v=20261010-mp3">
</head>
<body>
  <div class="scene">
    <div id="snow" class="snow" aria-hidden="true"></div>
    <main class="greeting">
      <div class="greeting-inner">
        <div class="heart" aria-hidden="true">&#9829;</div>
        <h1 lang="en">Miki <span class="ampersand">&amp;</span> Saki</h1>
        <p lang="en">Merry Christmas 2026</p>
        <div class="flourish" aria-hidden="true">&#10022; &nbsp; &#10022; &nbsp; &#10022;</div>
      </div>
    </main>
    <div id="music-panel" class="music-panel">
      <div class="music-controls" role="group" aria-label="音楽と画面の操作">
        <div class="music-buttons">
          <button id="music-previous" class="music-skip" type="button" aria-label="前の曲" aria-controls="background-music" aria-describedby="music-help" disabled>&#8249;</button>
          <button id="music-toggle" type="button" lang="en" aria-controls="background-music" aria-describedby="music-track music-help" aria-pressed="false" disabled>Play music</button>
          <button id="music-next" class="music-skip" type="button" aria-label="次の曲" aria-controls="background-music" aria-describedby="music-help" disabled>&#8250;</button>
        </div>
        <p id="music-track" aria-live="polite" aria-atomic="true">1 / 3　やさしいベルと合奏</p>
        <div class="display-buttons">
          <button id="fullscreen-toggle" class="setting-button" type="button" aria-describedby="music-help display-status" aria-pressed="false" disabled>全画面</button>
        </div>
        <p id="music-help">決定で操作 / 左右で選曲 / 上下で全画面へ</p>
      </div>
      <p id="music-status" role="status" aria-live="polite">音楽にはJavaScriptが必要です</p>
      <p id="display-status" role="status" aria-live="polite"></p>
      <p class="music-credit" lang="en">
        <a id="music-credit-track" href="https://incompetech.com/music/royalty-free/index.html?isrc=USUAN1100391" target="_blank" rel="noopener noreferrer">Wish Background — Kevin MacLeod</a>
        <span aria-hidden="true"> / </span>
        <a class="music-license" href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>
        <span class="audio-adaptation" lang="ja">（音量調整・再圧縮）</span>
      </p>
    </div>
    <audio id="background-music" preload="none" loop></audio>
  </div>
  <script src="./app.js?v=20261010-mp3"></script>
  <script src="./fullscreen.js?v=20261010-tv"></script>
</body>
</html>
